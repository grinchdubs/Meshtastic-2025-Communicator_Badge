name: Build Meshtastic Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clone Meshtastic firmware
      run: |
        git clone --depth 1 --branch master https://github.com/meshtastic/firmware.git meshtastic-firmware
        ls -la meshtastic-firmware/
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Copy variant files
      run: |
        mkdir -p meshtastic-firmware/variants/esp32s3/supercon_heltec
        cp -r meshtastic_variant/supercon_2025/* meshtastic-firmware/variants/esp32s3/supercon_heltec/
    
    - name: Install dependencies
      working-directory: ./meshtastic-firmware
      run: pio pkg install -e supercon-heltec
    
    - name: Copy LGFX driver
      run: |
        LGFX_DEST="meshtastic-firmware/.pio/libdeps/supercon-heltec/meshtastic-device-ui/include/graphics/LGFX/"
        mkdir -p "$LGFX_DEST"
        cp meshtastic-firmware/variants/esp32s3/supercon_heltec/device-ui-patches/graphics/LGFX/LGFX_SUPERCON_2025.h "$LGFX_DEST/"
    
    - name: Patch DisplayDriverFactory
      working-directory: ./meshtastic-firmware
      run: |
        FILE=".pio/libdeps/supercon-heltec/meshtastic-device-ui/source/graphics/driver/DisplayDriverFactory.cpp"
        
        # Add the include
        if ! grep -q "LGFX_SUPERCON_2025.h" "$FILE"; then
          sed -i '1i #include "graphics/LGFX/LGFX_SUPERCON_2025.h"' "$FILE"
        fi
        
        echo "✓ DisplayDriverFactory patched"
    
    - name: Build firmware
      working-directory: ./meshtastic-firmware
      run: pio run -e supercon-heltec
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-supercon-heltec
        path: |
          meshtastic-firmware/.pio/build/supercon-heltec/firmware.bin
          meshtastic-firmware/.pio/build/supercon-heltec/firmware.factory.bin
          meshtastic-firmware/.pio/build/supercon-heltec/firmware.elf
        if-no-files-found: error
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          meshtastic-firmware/.pio/build/supercon-heltec/firmware.factory.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Trigger build
