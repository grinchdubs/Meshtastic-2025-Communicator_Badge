name: Build Meshtastic Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clone Meshtastic firmware
      run: |
        git clone --depth 1 --branch master https://github.com/meshtastic/firmware.git meshtastic-firmware
        ls -la meshtastic-firmware/
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Copy variant files
      run: |
        mkdir -p meshtastic-firmware/variants/esp32s3/supercon_2025
        cp -r meshtastic_variant/supercon_2025/* meshtastic-firmware/variants/esp32s3/supercon_2025/
    
    - name: Copy board definition
      run: |
        mkdir -p meshtastic-firmware/boards
        cp meshtastic_variant/supercon_2025/supercon_2025.json meshtastic-firmware/boards/
    
    - name: Install dependencies
      working-directory: ./meshtastic-firmware
      run: pio pkg install -e supercon_2025
    
    - name: Copy LGFX driver and create header symlink
      run: |
        LGFX_DEST="meshtastic-firmware/.pio/libdeps/supercon_2025/meshtastic-device-ui/include/graphics/LGFX/"
        mkdir -p "$LGFX_DEST"
        if [ -f "meshtastic-firmware/variants/esp32s3/supercon_2025/device-ui-patches/graphics/LGFX/LGFX_SUPERCON_2025.h" ]; then
          cp meshtastic-firmware/variants/esp32s3/supercon_2025/device-ui-patches/graphics/LGFX/LGFX_SUPERCON_2025.h "$LGFX_DEST/"
          echo "✓ LGFX_SUPERCON_2025.h copied to device-ui"
        else
          echo "Error: LGFX_SUPERCON_2025.h not found!"
          exit 1
        fi
    
    - name: Patch DisplayDriverFactory
      working-directory: ./meshtastic-firmware
      run: |
        FILE=".pio/libdeps/supercon_2025/meshtastic-device-ui/source/graphics/driver/DisplayDriverFactory.cpp"
        
        # Simple approach: just add the include at the top of the file
        if ! grep -q "LGFX_SUPERCON_2025.h" "$FILE"; then
          sed -i '1i #if defined(LGFX_DRIVER)\n#include "graphics/LGFX/LGFX_SUPERCON_2025.h"\n#endif' "$FILE"
          echo "✓ Added LGFX_SUPERCON_2025.h include"
        fi
        
        echo "✓ DisplayDriverFactory patched"
    
    - name: Build firmware
      working-directory: ./meshtastic-firmware
      run: pio run -e supercon_2025
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-supercon-2025
        path: |
          meshtastic-firmware/.pio/build/supercon_2025/firmware.bin
          meshtastic-firmware/.pio/build/supercon_2025/firmware.factory.bin
          meshtastic-firmware/.pio/build/supercon_2025/firmware.elf
        if-no-files-found: error
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          meshtastic-firmware/.pio/build/supercon_2025/firmware.factory.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Trigger build
