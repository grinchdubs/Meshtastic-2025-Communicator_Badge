name: Build Meshtastic Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clone Meshtastic firmware
      run: |
        git clone --depth 1 --branch master https://github.com/meshtastic/firmware.git meshtastic-firmware
        ls -la meshtastic-firmware/
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Copy variant files
      run: |
        mkdir -p meshtastic-firmware/variants/esp32s3/supercon_2025
        cp -r meshtastic_variant/supercon_2025/* meshtastic-firmware/variants/esp32s3/supercon_2025/
    
    - name: Copy board definition
      run: |
        mkdir -p meshtastic-firmware/boards
        cp meshtastic_variant/supercon_2025/supercon_2025.json meshtastic-firmware/boards/
    
    - name: Install dependencies
      working-directory: ./meshtastic-firmware
      run: pio pkg install -e supercon_2025
    
    - name: Copy LGFX driver
      run: |
        LGFX_DEST="meshtastic-firmware/.pio/libdeps/supercon_2025/meshtastic-device-ui/include/graphics/LGFX/"
        mkdir -p "$LGFX_DEST"
        if [ -d "meshtastic-firmware/variants/esp32s3/supercon_2025/device-ui-patches/LGFX" ]; then
          cp meshtastic-firmware/variants/esp32s3/supercon_2025/device-ui-patches/LGFX/*.h "$LGFX_DEST/"
        fi
    
    - name: Patch DisplayDriverFactory
      working-directory: ./meshtastic-firmware
      run: |
        python3 << 'EOF'
        import os
        file_path = '.pio/libdeps/supercon_2025/meshtastic-device-ui/source/graphics/driver/DisplayDriverFactory.cpp'
        
        # Wait for file to exist
        if not os.path.exists(file_path):
            print(f'Warning: {file_path} not found yet')
            exit(0)
        
        with open(file_path, 'r') as f:
            content = f.read()
        
        # Add include for LGFX_SUPERCON_2025
        if '#include "graphics/LGFX/LGFX_SUPERCON_2025.h"' not in content:
            # Find the last LGFX include and add after it
            if '#include "graphics/LGFX/' in content:
                last_lgfx = content.rfind('#include "graphics/LGFX/')
                next_endif = content.find('#endif', last_lgfx)
                if next_endif != -1:
                    insertion_point = next_endif + len('#endif\n')
                    content = (content[:insertion_point] + 
                              '#ifdef LGFX_DRIVER\n' +
                              '#if LGFX_DRIVER == LGFX_SUPERCON_2025\n' +
                              '#include "graphics/LGFX/LGFX_SUPERCON_2025.h"\n' +
                              '#endif\n' +
                              '#endif\n' +
                              content[insertion_point:])
        
        # Add screen dimension override
        if 'LGFX_SCREEN_WIDTH' not in content:
            content = content.replace(
                '#elif defined(LGFX_DRIVER)\n    return new LGFXDriver<LGFX_DRIVER>(width, height);',
                '#elif defined(LGFX_DRIVER)\n#if defined(LGFX_SCREEN_WIDTH) && defined(LGFX_SCREEN_HEIGHT)\n    return new LGFXDriver<LGFX_DRIVER>(LGFX_SCREEN_WIDTH, LGFX_SCREEN_HEIGHT);\n#else\n    return new LGFXDriver<LGFX_DRIVER>(width, height);\n#endif'
            )
        
        with open(file_path, 'w') as f:
            f.write(content)
        
        print('✓ DisplayDriverFactory patched')
        EOF
    
    - name: Build firmware
      working-directory: ./meshtastic-firmware
      run: pio run -e supercon_2025
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-supercon-2025
        path: |
          meshtastic-firmware/.pio/build/supercon_2025/firmware.bin
          meshtastic-firmware/.pio/build/supercon_2025/firmware.factory.bin
          meshtastic-firmware/.pio/build/supercon_2025/firmware.elf
        if-no-files-found: error
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          meshtastic-firmware/.pio/build/supercon_2025/firmware.factory.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Trigger build
