[env:supercon-heltec]
extends = esp32s3_base
board = supercon-heltec  ; Custom board: memory_type=qio_opi (T-Deck PSRAM config) + flash_mode=dio (your flash)
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SUPERCON_HELTEC
  -I variants/esp32s3/supercon_heltec
  -I variants/esp32s3/supercon_heltec/device-ui-patches
  -D USE_SX1262
  ; Display ENABLED with custom board.json: memory_type=qio_opi + flash_mode=dio
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D RAM_SIZE=1560
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  ; -D USE_LOG_DEBUG  ; DISABLED: Use standard Meshtastic logging
  ; -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  ; LGFX driver configuration
  -D LGFX_SUPERCON_HELTEC
  -D LGFX_DRIVER=LGFX_SUPERCON_2025
  -D GFX_DRIVER_INC="graphics/LGFX/LGFX_SUPERCON_2025.h"
  -D VIEW_320x240
  -D DISPLAY_SIZE=428x142
  -D LGFX_SCREEN_WIDTH=428
  -D LGFX_SCREEN_HEIGHT=142
  ; Pin definitions
  -D LGFX_PIN_SCK=38
  -D LGFX_PIN_MOSI=21
  -D LGFX_PIN_DC=39
  -D LGFX_PIN_CS=41
  -D LGFX_PIN_BL=2
  -D LGFX_PIN_RST=40
  ; ST7789 compatibility pins
  -D TFT_CS=LGFX_PIN_CS
  -D ST7789_CS=TFT_CS
  -D ST7789_RS=LGFX_PIN_DC
  -D ST7789_SDA=LGFX_PIN_MOSI
  -D ST7789_SCK=LGFX_PIN_SCK
  -D ST7789_RESET=LGFX_PIN_RST
  -D ST7789_MISO=-1
  -D ST7789_BUSY=-1
  -D ST7789_BL=LGFX_PIN_BL
  -D ST7789_SPI_HOST=SPI2_HOST
  -D TFT_BL=ST7789_BL
  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=16000000
  -D TFT_HEIGHT=428
  -D TFT_WIDTH=142
  -D TFT_OFFSET_X=0
  -D TFT_OFFSET_Y=12
  -D TFT_OFFSET_ROTATION=3
  -D SCREEN_ROTATE
  -D SCREEN_TRANSITION_FRAMERATE=5
  -D BRIGHTNESS_DEFAULT=130
  ; Other features
  -D HAS_GPS=0
  -D HAS_BLUETOOTH=1
  -D HAS_WIFI=1
  -D PRIVATE_HW

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@^1.2.0
