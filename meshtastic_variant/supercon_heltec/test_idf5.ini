# Test ESP-IDF v5.x for PSRAM Fix
# 
# This is a custom platformio environment that attempts to use
# ESP-IDF v5.x (via espressif32@7.x platform) which MicroPython
# uses successfully to initialize the APS6404 PSRAM.

[env:supercon-heltec-idf5]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

# Try ESP-IDF v5.1 platform (instead of default 6.11.0 which uses ESP-IDF v4.4)
platform = espressif32@^7.0.0
platform_packages =
    framework-esp-idf @ ~3.50100.0  ; ESP-IDF v5.1

# Use custom sdkconfig for PSRAM
board_build.esp-idf.sdkconfig_path = variants/esp32s3/supercon_heltec/sdkconfig.supercon_heltec

build_flags =
  ${esp32s3_base.build_flags}
  -D BOARD_HAS_PSRAM
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D RAM_SIZE=1560
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_PACKET_API
  -I variants/esp32s3/supercon_2025

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@^1.2.0

; Compile custom PSRAM diagnostic code
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/supercon_2025/psram_fix.cpp>
